<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="5" />
    <title>Table</title>
    <style>
      * {
        background: #342626;
        color: aliceblue;
      }

      table {
        border-collapse: collapse;
      }

      td {
        border: 1px solid rgb(215, 199, 199);
      }
    </style>
  </head>

  <body>
    <table border="1" cellpadding="10">
      <tr>
        <td>
          <table border="1" cellpadding="5">
            <tr>
              <td>Nested 1</td>
              <td>Nested 2</td>
            </tr>
            <tr>
              <td>Nested 3</td>
              <td>Nested 4</td>
            </tr>
          </table>
        </td>

        <td>
          <!-- Nested Table -->
          <table border="1" cellpadding="5">
            <!-- <tr>
              <td>Nested 1</td>
              <td>Nested 2</td>
            </tr> -->
            <tr>
              <td>Nested 3</td>
              <td>Nested 4</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>

    <form action="">
      <input type="text" /> <br /><br />
      <button type="submit" style="cursor: pointer">Submit</button>
      <input type="submit" value="submit" />
      <select name="" id="">
        <option value="">Choose</option>
        <option value="">sayan</option>
        <option value="">adhikary</option>
      </select>
    </form>
  </body>
</html>
